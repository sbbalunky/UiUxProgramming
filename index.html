<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Game of the best</title>
</head>

<body>
  <!--
  사용자: 게임을 처음 접하거나, 익숙한 사람
  목적: 게임의 매력 이해, 플레이 욕구 유발
  핵심 행동: 게임에 대한 정보 확인과 플레이
  정보 순서: 게임 제목 -> 한 줄 소개 -> 특징 -> 캐릭터 -> 플레이 방식 -> 이미지/영상 -> 게임 정보 -> 플레이하기
  -->
  <header> 
    <h1>게임 소개 홈페이지</h1>
    <p>게이머들에게 게임에 대한 정보를 공유합니다.</p>
  </header>
  <h2>서비스 소개</h2>
  <h3>아직 경험하지 못한 게임을 접해보는 공간</h3>
</body>

</html>
